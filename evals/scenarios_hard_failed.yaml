- id: geo-m1-t4-l2-ssa-ambiguity-1
  tier: 3
  tags:
  - curriculum
  - grade-geometry
  - SSA
  - ambiguous-case
  - circle-construction
  - non-congruence
  prompt: 'Draw an SSA ambiguity diagram to show why SSA doesn''t prove congruence.
    Start with a base angle at vertex A — draw a ray from A. Mark a side length AB
    = 8 units along the ray and mark angle A = 40 degrees. Now from point B, draw
    a circle with radius 5 units. Show that this circle intersects the other ray from
    A at TWO different points — label them C1 and C2. This gives two different triangles:
    ABC1 and ABC2, both with the same angle at A, same side AB, and same length BC,
    but the triangles are different shapes. Label all points.'
  expected_properties:
  - name: C1_on_circle_centered_at_B
    type: point_on_circle
    args:
    - C1
    - B
    - C1
  - name: C2_on_circle_centered_at_B
    type: point_on_circle
    args:
    - C2
    - B
    - C2
  - name: BC1_equals_BC2
    type: equal_lengths
    args:
    - - B
      - C1
    - - B
      - C2
  - name: label_A_present
    type: label_present
    args:
    - A
  - name: label_B_present
    type: label_present
    args:
    - B
  - name: label_C1_present
    type: label_present
    args:
    - C1
  - name: label_C2_present
    type: label_present
    args:
    - C2
  structural_checks: []
  required_labels:
  - A
  - B
  - C1
  - C2
  required_entities: []
  required_canvas: {}
  expected_points: {}
  coordinate_tolerance: 0.0001
  queries: []
