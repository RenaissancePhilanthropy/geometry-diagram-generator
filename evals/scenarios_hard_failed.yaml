  - grade-geometry
  - AA-similarity
  - vertical-angles
  - right-angles
  - similar-triangles
  prompt: Can you draw two triangles that share a common vertex in the middle where
    two lines cross, creating vertical angles? Label the crossing point as E, and
    label the four outer vertices A, B, C, D so that triangle AEB and triangle CED
    are formed. Mark the vertical angles at E as equal. Also mark angle A and angle
