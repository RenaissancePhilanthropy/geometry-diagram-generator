      - P
    - - E
      - P'
  - name: equal_dist_EQ_EQprime
    type: equal_lengths
    args:
    - - E
      - Q
    - - E
      - Q'
  - name: equal_lengths_PQ_PprimeQprime
    type: equal_lengths
    args:
    - - P
      - Q
    - - P'
      - Q'
