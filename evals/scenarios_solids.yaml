# Solids (rectangular prism) scenarios. Every scenario requires the "solids"
# feature group: run with `--features solids` (skipped, not failed, otherwise).
# Prism properties use the prism_volume / prism_dimensions property types
# (evaluated on the compiled Prism via query_prism, args: [prism_id, ...];
# "*" matches any prism). One authored rectangular_prism def per figure, so
# solid_count (not polygon_count) is the structural check.
# Prompts are original wordings of block-counting figures.
# required_labels are bare numbers: a label may or may not repeat the unit.

# Isometric look, unit cubes.
- id: prism-unit-cubes-isometric
  tier: 2
  tags: [solids, prism, unit-cubes, isometric, volume]
  requires_features: [solids]
  prompt: "Draw a box built from unit cubes, stacked 5 layers high. Count 2 cubes along its front bottom edge and 4 cubes along its right bottom edge."
  expected_properties:
    - name: prism_volume_40
      type: prism_volume
      args: ["*", 40]
    - name: prism_dimensions_2_4_5
      type: prism_dimensions
      args: ["*", 2, 4, 5]
  structural_checks:
    - name: one_unit_cube_prism
      type: solid_count
      args: {kind: rectangular_prism, min: 1, length: 2, width: 4, height: 5}

# Oblique look, solid.
- id: prism-oblique-solid
  tier: 2
  tags: [solids, prism, oblique, volume, labels]
  requires_features: [solids]
  prompt: "Draw a solid box that is 11 units long, 3 units wide and 6 units tall. Label its height 6 units, its width 3 units and its length 11 units."
  required_labels: ["6", "3", "11"]
  expected_properties:
    - name: prism_volume_198
      type: prism_volume
      args: ["*", 198]
    - name: prism_dimensions_11_3_6
      type: prism_dimensions
      args: ["*", 11, 3, 6]
  structural_checks:
    - name: one_prism
      type: solid_count
      args: {kind: rectangular_prism, min: 1, length: 11, width: 3, height: 6}

# Oblique wireframe with a shaded base. Length and width are not
# given (only the base area), so volume is asserted, not dimensions.
- id: prism-oblique-wireframe-base-area
  tier: 3
  tags: [solids, prism, oblique, wireframe, base-area, volume, labels]
  requires_features: [solids]
  prompt: "Draw a wireframe box with its base shaded. The box is 5 units tall and its base has an area of 60 square units. Label the height 5 units and the base area 60 square units."
  required_labels: ["5", "60"]
  expected_properties:
    - name: prism_volume_300
      type: prism_volume
      args: ["*", 300]
  structural_checks:
    - name: one_prism
      type: solid_count
      args: {kind: rectangular_prism, min: 1}

# Same as prism-oblique-solid / prism-oblique-wireframe-base-area with a named
# unit, to see whether the model carries the unit into its labels (required
# labels stay bare numbers; the unit is inspected by hand).
- id: prism-oblique-solid-feet
  tier: 2
  tags: [solids, prism, oblique, volume, labels, units]
  requires_features: [solids]
  prompt: "Draw a solid box that is 11 feet long, 3 feet wide and 6 feet tall. Label its height 6 feet, its width 3 feet and its length 11 feet."
  required_labels: ["6", "3", "11"]
  expected_properties:
    - name: prism_volume_198
      type: prism_volume
      args: ["*", 198]
    - name: prism_dimensions_11_3_6
      type: prism_dimensions
      args: ["*", 11, 3, 6]
  structural_checks:
    - name: one_prism
      type: solid_count
      args: {kind: rectangular_prism, min: 1, length: 11, width: 3, height: 6}

- id: prism-oblique-wireframe-base-area-feet
  tier: 3
  tags: [solids, prism, oblique, wireframe, base-area, volume, labels, units]
  requires_features: [solids]
  prompt: "Draw a wireframe box with its base shaded. The box is 5 feet tall and its base has an area of 60 square feet. Label the height 5 feet and the base area 60 square feet."
  required_labels: ["5", "60"]
  expected_properties:
    - name: prism_volume_300
      type: prism_volume
      args: ["*", 300]
  structural_checks:
    - name: one_prism
      type: solid_count
      args: {kind: rectangular_prism, min: 1}

# --- Block stacks (irregular stacks of unit cubes) ---------------------------
# Each stack scenario has a solid_count (kind block_stack, literal cube_count
# read from the authored heights/cubes) and a stack_cube_count property
# (query_stack on the compiled Stack, "*" = any stack). Scenarios cannot assert
# pipeline warnings, so the overhang scenario is checked structurally on its
# cube count only; whether the not-a-height-map warning fired is read from the
# run's warnings by hand.

# Isometric height map: front row [1, 2, 3], back row [3, 1, 2] = 12 cubes.
- id: stack-isometric-heightmap
  tier: 3
  tags: [solids, stack, isometric, height-map, cube-count]
  requires_features: [solids]
  prompt: "Draw a stack of unit cubes, isometric view. The stack is 3 cubes wide and 2 cubes deep. From left to right the front row has 1, 2 and 3 cubes, and the back row has 3, 1 and 2 cubes."
  expected_properties:
    - name: stack_cube_count_12
      type: stack_cube_count
      args: ["*", 12]
  structural_checks:
    - name: one_stack_of_12
      type: solid_count
      args: {kind: block_stack, min: 1, cube_count: 12}

# Oblique height map, 4 wide and 2 deep: front row [1, 3, 2, 4] (10), back row
# [1, 2, 1, 2] (6) = 16 cubes; asks for the total as a label.
- id: stack-oblique-labeled-total
  tier: 3
  tags: [solids, stack, oblique, height-map, cube-count, labels]
  requires_features: [solids]
  prompt: "Draw a stack of unit cubes, oblique view. The stack is 4 cubes wide and 2 cubes deep. From left to right the front row has 1, 3, 2 and 4 cubes, and the back row has 1, 2, 1 and 2 cubes. How many cubes are in the stack? Label the stack with the number of cubes."
  required_labels: ["16"]
  expected_properties:
    - name: stack_cube_count_16
      type: stack_cube_count
      args: ["*", 16]
  structural_checks:
    - name: one_stack_of_16
      type: solid_count
      args: {kind: block_stack, min: 1, cube_count: 16}

# Overhang (not a height map): an arch of 5 unit cubes. The not-a-height-map
# warning is expected but cannot be asserted by a scenario (see header).
- id: stack-overhang-arch
  tier: 3
  tags: [solids, stack, overhang, cube-set, cube-count]
  requires_features: [solids]
  prompt: "Draw an arch made of unit cubes, isometric view. The arch is 3 cubes wide and 1 cube deep. The left and right pillars are each 2 cubes tall. There is a 1-cube empty space between the pillars, and one cube bridges the gap, level with the top cube of each pillar, so the arch is 2 cubes tall."
  expected_properties:
    - name: stack_cube_count_5
      type: stack_cube_count
      args: ["*", 5]
  structural_checks:
    - name: one_stack_of_5
      type: solid_count
      args: {kind: block_stack, min: 1, cube_count: 5}
