- id: legitimate-remove-angle-bisector
  category: legitimate
  request: "Remove the angle bisector construction — the bisector line, the point M, and the angle marks. Just keep the plain triangle."
  prior_script: |
    # Define the three vertices
    A = point(0, 0)
    B = point(6, 0)
    C = point(2, 5)

    # Build the triangle
    tri = triangle(A, B, C)

    # Draw the triangle
    draw(tri)

    # Construct the angle bisector from A (toward B and C)
    bisector = angle_bisector(A, B, C)

    # Find where the bisector meets BC
    bc_seg = tri.side(B, C)
    M = intersection(bisector, bc_seg)

    # Draw the angle bisector segment from A to M
    draw(segment(A, M), color="blue")

    # Mark the two equal angles created by the bisector at A
    mark_angle(angle(B, A, M), group=1)
    mark_angle(angle(M, A, C), group=1)

    # Label all three vertices A, B, C and the point M
    A.label("A", pos="below left")
    B.label("B", pos="below right")
    C.label("C", pos="above")
    M.label("M", pos="right")

    # Mark the points
    draw_points(A, B, C, M)
  edited_script: |
    # Define the three vertices
    A = point(0, 0)
    B = point(6, 0)
    C = point(2, 5)

    # Build the triangle
    tri = triangle(A, B, C)

    # Draw the triangle
    draw(tri)

    # Label all three vertices
    A.label("A", pos="below left")
    B.label("B", pos="below right")
    C.label("C", pos="above")

    # Mark the points
    draw_points(A, B, C)
  # Was temporarily [M] only: `bisector` (and, it turned out, `bc_seg`) are
  # bare sympy Line/Segment objects with no .vertices, which used to make
  # centroid_of_obj raise AttributeError and build_entity_manifest's
  # except-and-skip silently exclude them from "named" entirely —
  # check_edit_locality couldn't see a Line/Segment/Ray variable appear,
  # disappear, or move at all (confirmed 2026-08-18; this fixture is what
  # surfaced it, failing identically across three unrelated models for
  # that structural reason, not a real judgment difference). Fixed in
  # render_util.py's centroid_of_obj (LinearEntity branch, midpoint of
  # .p1/.p2). Once fixed, all three models ALSO correctly dropped `bc_seg`
  # (tri.side(B, C), used only to compute M) — a second fixture-authoring
  # gap on the same root cause, not a new model issue: bc_seg belongs in
  # this list too, since removing it along with the rest of the
  # construction is the correct behavior, not an over-deletion.
  expect_still_unmatched: [bisector, bc_seg, M]
