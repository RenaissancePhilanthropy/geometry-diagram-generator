  edited_script: |
    # Define the three vertices of triangle ABC
    A = point(0, 0)
    B = point(4, 0)
    C = point(1, 3)

    # Build triangle ABC
    tri = triangle(A, B, C)

    # Define the three vertices of triangle DEF
    D = point(6, 0)
    E = point(10, 0)
    F = point(7, 3)

    # Build triangle DEF
    tri2 = triangle(D, E, F)

    # Fill triangle ABC blue and triangle DEF red
    fill(tri, color="blue")
    fill(tri2, color="red")

    # Draw the triangles
    draw(tri)
    draw(tri2)

    # Label the vertices
    A.label("A", pos="below left")
    B.label("B", pos="below right")
    C.label("C", pos="above")
    D.label("D", pos="below left")
    E.label("E", pos="below right")
    F.label("F", pos="above")

    # Mark the points
    draw_points(A, B, C, D, E, F)
  expect_still_unmatched: []

- id: illegitimate-dropped-angle-bisector
  category: illegitimate
  request: "Draw the incircle of the triangle, calling its center I."
  prior_script: |
    # Define the three vertices
    A = point(0, 0)
    B = point(6, 0)
    C = point(2, 5)

    # Build the triangle
    tri = triangle(A, B, C)

    # Draw the triangle
    draw(tri)

    # Construct the angle bisector from A (toward B and C)
    bisector = angle_bisector(A, B, C)

    # Find where the bisector meets BC
    bc_seg = tri.side(B, C)
    M = intersection(bisector, bc_seg)

    # Draw the angle bisector segment from A to M
    draw(segment(A, M), color="blue")

    # Mark the two equal angles created by the bisector at A
    mark_angle(angle(B, A, M), group=1)
    mark_angle(angle(M, A, C), group=1)

    # Label all three vertices A, B, C and the point M
    A.label("A", pos="below left")
    B.label("B", pos="below right")
    C.label("C", pos="above")
    M.label("M", pos="right")

    # Mark the points
    draw_points(A, B, C, M)
  edited_script: |
    # Define the three vertices
    A = point(0, 0)
    B = point(6, 0)
    C = point(2, 5)

    # Build the triangle
    tri = triangle(A, B, C)

    # Draw the triangle
    draw(tri)

    # Construct the incircle
    ic = incircle(tri)
    I = ic.center

    # Draw the incircle
    draw(ic, color="blue")

    # Label the center I
    I.label("I", pos="below")

    # Label all three vertices
    A.label("A", pos="below left")
    B.label("B", pos="below right")
    C.label("C", pos="above")

    # Mark the points
    draw_points(A, B, C, I)
  expect_still_unmatched: []

