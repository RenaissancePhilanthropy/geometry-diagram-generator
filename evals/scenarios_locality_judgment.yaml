# Fixture bank for evals/eval_locality_retry_judgment.py — tests ONLY the
# retry_on_locality_violation confirmation retry's judgment call, isolated
# from the rest of the edit pipeline. Each fixture is a single (prior
# script, request, already-edited script) triple that check_edit_locality
# is known to flag as a violation; category says whether the flagged
# change was real corruption (should be fixed) or a legitimate
# deletion/move the request actually asked for (should be left alone).
#
# expect_still_unmatched lists exactly which named entities should be
# absent from the FINAL script (after the retry) — empty for illegitimate
# fixtures (everything should be restored), non-empty for legitimate ones
# (the entity really was supposed to go and should stay gone).
#
# The three "illegitimate" fixtures are real corruption captured live this
# session (not synthesized) — see
# evals/results/edit_chain_artifacts/20260813-053117-99543/. The three
# "legitimate" fixtures are hand-authored deletions built from the same
# starting scripts, so each pair isolates request-phrasing as the only
# variable while holding the entities/positions fixed.

- id: illegitimate-dropped-second-triangle
  category: illegitimate
  request: "Draw the circumcircle of triangle ABC and call its center O."
  prior_script: |
    # Define the three vertices
    A = point(0, 0)
    B = point(4, 0)
    C = point(0, 3)

    # Build the triangle
    tri = triangle(A, B, C)

    # Draw the triangle
    draw(tri)

    # Label the vertices
    A.label("A", pos="below left")
    B.label("B", pos="below right")
    C.label("C", pos="above left")

    # Mark the points
    draw_points(A, B, C)

    # Define the second triangle DEF to the right of the first
    D = point(6, 0)
    E = point(10, 0)
    F = point(6, 3)

    # Build the second triangle
    tri2 = triangle(D, E, F)

    # Draw the second triangle
    draw(tri2)

    # Label the vertices
    D.label("D", pos="below left")
    E.label("E", pos="below right")
    F.label("F", pos="above left")

    # Mark the points
    draw_points(D, E, F)
  edited_script: |
    # Define the three vertices
    A = point(0, 0)
    B = point(4, 0)
    C = point(1, 3)

    # Build the triangle
    tri = triangle(A, B, C)

    # Compute circumcircle
    cc = circumcircle(tri)
    O = cc.center

    # Draw the triangle and circumcircle
    draw(tri)
    draw(cc, color="blue")

    # Label the vertices and center
    A.label("A", pos="below left")
    B.label("B", pos="below right")
    C.label("C", pos="above")
    O.label("O", pos="below right")

    # Mark the points
    draw_points(A, B, C, O)
  expect_still_unmatched: []

