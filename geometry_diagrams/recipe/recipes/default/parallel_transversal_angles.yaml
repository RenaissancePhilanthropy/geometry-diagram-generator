name: parallel_transversal_angles
description: "Two parallel lines AB and CD cut by a transversal, with corresponding, alternate interior, and alternate exterior angle pairs marked"
tags: [parallel, transversal, angle, annotation-heavy, intermediate]
context: "Given points A, B on the first line and C, D on the second line."
setup: []
example:
  mode: grid
  construction:
    - op: point
      id: A
      coords: [0, 0]
    - op: point
      id: B
      coords: [4, 0]
    - op: point
      id: C
      coords: [0, 2]
    - op: point
      id: D
      coords: [4, 2]
    - op: line_through
      id: L1
      points: [A, B]
    - op: parallel
      id: L2
      to_line: L1
      through: C
    - op: point
      id: E
      coords: [2, -1]
      visible: false
    - op: point
      id: F
      coords: [3, 3]
      visible: false
    - op: line_through
      id: Trans
      points: [E, F]
    - op: intersection
      id: G
      of: [L1, Trans]
    - op: intersection
      id: H
      of: [L2, Trans]
  annotations:
    marks:
      - kind: mark_angle_pair
        relation: corresponding
        vertices: [G, H]
        rays_along: [B, D]
        group: 1
      - kind: mark_angle_pair
        relation: alternate_interior
        vertices: [G, H]
        rays_along: [A, D]
        group: 2
      - kind: mark_angle_pair
        relation: alternate_exterior
        vertices: [G, H]
        rays_along: [B, C]
        group: 3
notes:
  - "L1 (through A, B) and L2 (through C, D) are parallel; Trans (through E, F) is the transversal"
  - "mark_angle_pair handles picking the correct ray at each vertex automatically — just name the two intersection vertices (G, H) and any one point on the non-transversal line at each (e.g. B at G, D at H). Do NOT try to pick 'the right side' yourself with plain mark_angle — that is exactly the mistake this op exists to avoid."
  - "Three relations: corresponding, alternate_interior, alternate_exterior. co_interior (same-side interior) is not supported by mark_angle_pair — those angles are supplementary, not equal."
