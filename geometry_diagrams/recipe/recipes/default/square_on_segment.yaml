name: square_on_segment
description: "Square constructed on the exterior of a triangle edge"
tags: [polygon, square, exterior, intermediate]
context: "Given a triangle T with vertices A, B, C."
setup:
  - op: triangle
    id: T
    vertices: [A, B, C]
    spec:
      angle_A: 60
      angle_B: 70
      side_AB: 4
example:
  mode: abstract
  construction:
    # T_ex defines A, B, C directly (matching setup's triangle constraints) —
    # the example must be self-contained, since setup is context only and is
    # never sent to the model. A separate id from setup's "T" (setup and
    # example ids must be disjoint).
    - op: triangle
      id: T_ex
      vertices: [A, B, C]
      spec:
        angle_A: 60
        angle_B: 70
        side_AB: 4
    - op: polygon_exterior
      id: sq
      base: [A, B]
      ref_point: C
      n: 4
      vertices: [sq_v2, sq_v3]
notes:
  - "ref_point C tells the lowering which side is 'interior'; the square is placed on the opposite side"
  - "vertices list names v2 and v3 (v0=A, v1=B are the base edge)"
  - "A/B/C are defined directly here via T_ex, NOT by referencing setup's own triangle T — an example must define every point it uses itself, since setup is background context only and is never shown to you."
