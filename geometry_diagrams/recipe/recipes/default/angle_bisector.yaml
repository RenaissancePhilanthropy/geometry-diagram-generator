name: angle_bisector
description: "Line bisecting an angle at a vertex into two equal angles"
tags: [triangle, angle, bisector, basic]
context: "Given a triangle T with vertices A, B, C."
setup: []
example:
  mode: abstract
  construction:
    - op: triangle
      id: T
      vertices: [A, B, C]
      spec:
        angle_A: 60
        angle_B: 70
        side_AB: 4
    - op: angle_bisector
      id: bis_B
      vertex: B
      ray1_toward: A
      ray2_toward: C
    - op: intersection
      id: D
      of: [bis_B, T]
      selector:
        kind: between
        a: A
        b: C
notes:
  - "The intersection with the opposite side uses a 'between' selector to get the interior point"
  - "When the problem states an angle that may be inconsistent with the constructed geometry, draw the arc with mark_angle (omit its expected) and show the value with a separate label_angle using given:true — mark_angle's own expected is never shown as text, only checked geometrically."
