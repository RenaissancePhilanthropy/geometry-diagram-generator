name: similar_triangles
description: "Two similar triangles drawn side by side with proportional corresponding sides marked"
tags: [triangle, similarity, proportional, intermediate]
context: "No prerequisite objects."
setup: []
example:
  mode: abstract
  construction:
    - op: triangle
      id: T1
      vertices: [A, B, C]
      spec:
        angle_A: 50
        angle_B: 70
        side_AB: 3
      center: [1.5, 2]
    - op: triangle
      id: T2
      vertices: [D, E, F]
      spec:
        angle_D: 50
        angle_E: 70
        side_DE: 4.5
      center: [5.5, 2]
  annotations:
    marks:
      - kind: mark_proportional
        segments: [[A, B], [D, E]]
        group: 1
      - kind: mark_proportional
        segments: [[B, C], [E, F]]
        group: 2
      - kind: mark_proportional
        segments: [[A, C], [D, F]]
        group: 3
notes:
  - "CRITICAL — place triangles side by side using the 'center' field: first triangle center at [1.5, 2], second at [5.5, 2]. Without different centers both triangles overlap at (2,2)."
  - "Similar triangles have equal angles but proportional sides — use the SAME angle values at corresponding vertices in both specs (T1's angle_A/angle_B = T2's angle_D/angle_E)"
  - "Scale the second triangle by changing its corresponding side: here side_DE=4.5 = 1.5 × side_AB=3, so scale factor is 1.5"
  - "Use mark_proportional (NOT mark_equal_lengths) for corresponding sides — proportional marks show similarity, not congruence"
  - "Corresponding vertex pairs: A↔D, B↔E, C↔F — mark_proportional groups match AB↔DE (group 1), BC↔EF (group 2), AC↔DF (group 3)"
  - "Offset centers by ~4 units horizontally so the triangles are clearly separated with a visible gap between them"
  - "When the problem states an angle that may be inconsistent with the constructed geometry, draw the arc with mark_angle (omit its expected) and show the value with a separate label_angle using given:true — mark_angle's own expected is never shown as text, only checked geometrically."
