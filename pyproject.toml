[project]
name = "geometry-tikz-demo"
version = "0.1.0"
description = "Generate geometry diagrams in TikZ using LLMs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic==0.84.0",
    "cairosvg>=2.8.2",
    "gepa>=0.1.0",
    "httpx>=0.27",
    "logfire>=4.34.0",
    "pydantic-ai-slim[ag-ui,anthropic,openai,web,ag-ui]>=1.66.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "pymupdf>=1.27.2.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

######
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strategies", "renderer", "ir"]
